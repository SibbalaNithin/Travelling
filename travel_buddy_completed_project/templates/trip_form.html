{% extends "base.html" %}{% block title %}{{ 'Edit trip' if trip else 'Publish a trip' }}{% endblock %}{% block content %}
<section class="page-heading"><span class="eyebrow">SHARE THE JOURNEY</span><h1>{{ 'Edit your trip' if trip else 'Publish a trip.' }}</h1><p>Give fellow travellers the details they need to see if your plans align.</p></section>
<form class="form-card wide-form" method="post"><div class="form-grid"><label>Origin<input name="origin" required maxlength="120" placeholder="e.g. Bengaluru" value="{{ trip.origin if trip else '' }}"></label><label>Destination<input name="destination" required maxlength="120" placeholder="e.g. Chikkamagaluru" value="{{ trip.destination if trip else '' }}"></label><label>Travel date<input type="date" name="travel_date" required min="{{ today.isoformat() }}" value="{{ trip.travel_date.isoformat() if trip else '' }}"></label><label>Departure time<input type="time" name="departure_time" required value="{{ trip.departure_time.strftime('%H:%M') if trip else '08:00' }}"></label><label>Vehicle<select name="vehicle" required>{% for v in ['Bike','Car','Van'] %}<option value="{{ v }}" {{ 'selected' if trip and trip.vehicle==v }}>{{ v }}</option>{% endfor %}</select></label><label>Available seats<input type="number" name="seats" min="1" max="15" required value="{{ trip.seats if trip else 1 }}"></label></div><label>Trip notes <span class="optional">(optional)</span><textarea name="notes" rows="4" maxlength="500" placeholder="Route preferences, planned stops, luggage, cost-sharing expectations…">{{ trip.notes if trip else '' }}</textarea></label><div class="form-actions"><a class="btn ghost" href="{{ url_for('dashboard') }}">Cancel</a><button class="btn primary">{{ 'Save changes' if trip else 'Publish trip' }} →</button></div></form>
{% endblock %}
